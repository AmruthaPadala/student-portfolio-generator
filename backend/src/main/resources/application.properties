spring.application.name=digital-portfolio-generator
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_generator_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Secret & Expiration (24 hours = 86400000 ms)
jwt.secret=${JWT_SECRET:DigitalPortfolioGeneratorSecretKey2026SecureLongTokenForStudentPortfolios}
jwt.expiration=${JWT_EXPIRATION:86400000}
